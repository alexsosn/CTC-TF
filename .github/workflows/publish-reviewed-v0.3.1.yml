name: Publish reviewed Burns v0.3.1

# Deliberate human confirmation is the only publishing trigger.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact, independently reviewed current master squash merge SHA (40 lowercase hex)'
        required: true
        type: string
      release_confirmation:
        description: 'Type v0.3.1@ followed immediately by the same full SHA'
        required: true
        type: string

concurrency:
  group: burns-v0.3.1-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Check out exact proposed release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact checkout and dispatch revision
        run: python scripts/check_ci_provenance.py
      - name: Verify reviewed squash merge, all integration gates, and publish exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          python -m scripts.publish_reviewed_v031 --publish
