name: Publish reviewed Burns v0.3.0

# Deliberate human confirmation is the only publishing trigger.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact, independently reviewed current master merge SHA (40 lowercase hex)'
        required: true
        type: string
      release_confirmation:
        description: 'Type v0.3.0@ followed immediately by the same full SHA'
        required: true
        type: string

# Prevent two manually dispatched publishers competing to create a tag.
concurrency:
  group: burns-v0.3.0-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out only the reviewed release-gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable release evidence then publish exact tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          python scripts/publish_reviewed_release.py --publish
