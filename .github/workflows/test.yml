name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify CI provenance
        run: python scripts/check_ci_provenance.py
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - name: Record execution environment
        run: |
          python - <<'PY'
          import hashlib
          import json
          import platform
          import sys
          from importlib import metadata

          packages = sorted(
              f"{name.casefold()}=={dist.version}"
              for dist in metadata.distributions()
              if (name := dist.metadata.get("Name"))
          )
          evidence = {
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "system": platform.system(),
              "release": platform.release(),
              "machine": platform.machine(),
              "packages": packages,
          }
          canonical = json.dumps(
              evidence,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          )
          print("execution_environment=" + canonical)
          print(
              "execution_environment_sha256="
              + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          )
          PY
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          import pathlib
          import ugarit_context_parsing.cli
          parser = importlib.import_module('scripts.parse_workbooks_to_csv')
          assert callable(parser.parse_pdf)
          assert 'ugarit-context-parsing' not in str(pathlib.Path(parser.__file__).resolve())
          PY
