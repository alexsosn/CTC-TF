name: Appendix CUC concordance audit

on:
  pull_request:
    paths:
      - '.github/workflows/test-appendix-cuc-concordance.yml'
      - 'scripts/check_appendix_cuc_concordance.py'
      - 'scripts/parse_appendix_to_csv.py'
      - 'scripts/sources.py'
      - 'src/ugarit_context_parsing/cuc_index.py'
      - 'src/ugarit_context_parsing/identifiers.py'
      - 'tests/test_appendix_concordance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-appendix-concordance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Burns software
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prove exact tested revision
        run: python scripts/check_ci_provenance.py
      - name: Check out pinned reviewed CUC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: DT-UCPH/cuc
          ref: ad69400f5446e1c8217af01659c7c10ab00c015b
          path: .cuc
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install parser and audit dependencies
        run: python -m pip install .
      - name: Parse pinned Appendix runner-locally
        run: python scripts/parse_appendix_to_csv.py --output "$RUNNER_TEMP/appendix.csv"
      - name: Audit Appendix against reviewed CUC using counts only
        run: python scripts/check_appendix_cuc_concordance.py "$RUNNER_TEMP/appendix.csv" .cuc/tf/0.2.8
      # Deliberately do not upload or cache Appendix, CSV output, or source-derived values.
