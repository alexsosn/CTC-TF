name: Reviewed CUC index contract

# Integration/adversarial history is recorded in
# research/issue-23/INTEGRATION_AMENDMENT.md. This workflow is the permanent
# exact-CUC gate that supersedes the temporary research workflow.
on:
  pull_request:
    paths:
      - 'docs/releases/**'
      - 'tests/test_release_version.py'
      - 'src/ugarit_context_parsing/cuc_index.py'
      - 'src/ugarit_context_parsing/alignment.py'
      - 'src/ugarit_context_parsing/annotations.py'
      - 'src/ugarit_context_parsing/references.py'
      - 'src/ugarit_context_parsing/module.py'
      - 'tests/test_cuc_index.py'
      - 'tests/test_burns_alignment.py'
      - 'tests/test_burns_tf_module*.py'
      - '.github/workflows/test-reviewed-cuc-index.yml'
      - 'scripts/check_ci_provenance.py'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: reviewed-cuc-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewed-cuc-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Burns module repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CI provenance
        run: python scripts/check_ci_provenance.py

      - name: Check out exact reviewed CUC base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DT-UCPH/cuc
          ref: ad69400f5446e1c8217af01659c7c10ab00c015b
          path: .cuc
          persist-credentials: false

      - name: Run actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Build exact reviewed CUC index through public gate
        run: |
          python - <<'PY'
          from ugarit_context_parsing.alignment import (
              BurnsAlignmentConfidence,
              BurnsAlignmentDisposition,
              BurnsAnchorKind,
              align_burns_annotation,
          )
          from ugarit_context_parsing.annotations import (
              BurnsAnnotation,
              BurnsInterpretiveStatus,
              BurnsSemanticStatus,
              BurnsTextualStatus,
              BurnsWorksheetRole,
          )
          from ugarit_context_parsing.cuc_index import (
              REVIEWED_CUC_COMMIT,
              REVIEWED_CUC_COUNTS,
              REVIEWED_CUC_MANIFEST_SHA256,
              build_reviewed_cuc_index,
          )

          index = build_reviewed_cuc_index('.cuc/tf/0.2.8')
          assert index.compatibility is not None
          assert index.compatibility.commit == REVIEWED_CUC_COMMIT
          assert index.compatibility.manifest_sha256 == REVIEWED_CUC_MANIFEST_SHA256
          assert len(index.tablet_nodes) == REVIEWED_CUC_COUNTS['tablet'] == 279
          assert len(index.column_nodes) == REVIEWED_CUC_COUNTS['column'] == 334
          assert len(index.line_nodes) == REVIEWED_CUC_COUNTS['line'] == 7616
          assert len(index.word_g_cons) == REVIEWED_CUC_COUNTS['word'] == 27770

          ambiguous = [nodes for nodes in index.bare_line_candidates.values() if len(nodes) > 1]
          assert len(ambiguous) == 607, len(ambiguous)
          assert max(map(len, ambiguous)) == 8
          assert sum(1 for value in index.word_g_cons.values() if value == '') == 528

          # CUC contains incidental raw column whitespace; reviewed lookup keys
          # must remain canonical without changing cardinality.
          assert all(column == column.strip() for _, column in index.column_nodes)
          assert all(column == column.strip() for _, column, _ in index.line_nodes)
          for nodes in index.bare_line_candidates.values():
              assert nodes == tuple(sorted(nodes))
          for words in index.line_words.values():
              assert isinstance(words, tuple)

          # Keep a small direct production-aligner check alongside the fuller
          # feature-module composition test below.
          before = (
              len(index.tablet_nodes),
              len(index.column_nodes),
              len(index.line_nodes),
              len(index.word_g_cons),
          )
          synthetic = BurnsAnnotation(
              annotation_id='burns-annotation-sha256:synthetic-reviewed-cuc-contract',
              worksheet_id='01 Synthetic/Worksheet 1',
              workbook_number=1,
              workbook_label='01 Synthetic',
              worksheet_number=1,
              worksheet_role=BurnsWorksheetRole.PRIME_GP,
              first_source_row=1,
              section='Section α',
              root='',
              headword='synthetic',
              ktu='1.14',
              references='',
              textual_status=BurnsTextualStatus.TEXTUAL,
              semantic_status=BurnsSemanticStatus.POSITIVE_FIXED,
              interpretive_status=BurnsInterpretiveStatus.UNSPECIFIED,
              record_ids=('burns-record-sha256:synthetic-reviewed-cuc-contract',),
          )
          aligned = align_burns_annotation(synthetic, index)
          assert aligned.disposition is BurnsAlignmentDisposition.ALIGNED
          assert len(aligned.occurrences) == 1
          occurrence = aligned.occurrences[0]
          assert occurrence.anchor_kind is BurnsAnchorKind.TABLET
          assert occurrence.confidence is BurnsAlignmentConfidence.EXACT_STRUCTURAL
          assert occurrence.anchor_nodes == (index.tablet_nodes['KTU 1.14'],)
          assert before == (
              len(index.tablet_nodes),
              len(index.column_nodes),
              len(index.line_nodes),
              len(index.word_g_cons),
          )
          PY

      - name: Write and combine feature-only Burns module
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from tf.fabric import Fabric

          from ugarit_context_parsing.alignment import align_burns_source
          from ugarit_context_parsing.annotations import normalize_workbook_records
          from ugarit_context_parsing.cuc_index import build_reviewed_cuc_index
          from ugarit_context_parsing.module import (
              FEATURES,
              REPORT_FILE,
              build_burns_module,
              build_burns_module_report,
              burns_node_annotations,
              write_burns_module,
          )
          from ugarit_context_parsing.source import WorkbookRecord

          cuc = Path('.cuc/tf/0.2.8').resolve()
          index = build_reviewed_cuc_index(cuc)

          # Pick public CUC words dynamically; all committed Burns-side content
          # in this gate remains synthetic.
          chosen = None
          for (tablet, column, line), line_node in sorted(index.line_nodes.items()):
              words = index.line_words[line_node]
              if len(words) < 2:
                  continue
              first = index.word_g_cons[words[0]]
              second = index.word_g_cons[words[1]]
              if not first or not second:
                  continue
              if any(character.isspace() for character in first + second):
                  continue
              if first.endswith(('*', '†', '!', '?')):
                  continue
              chosen = (tablet, column, line, line_node, words[0], words[1], first, second)
              break
          assert chosen is not None
          tablet, column, line, line_node, word1, word2, g1, g2 = chosen
          assert tablet.startswith('KTU ')
          raw_ktu = tablet.removeprefix('KTU ')
          reference = f'{column}.{line}'
          line_only_headword = 'syntheticunmatchedzzzz'
          assert line_only_headword not in {index.word_g_cons[word] for word in index.line_words[line_node]}

          def record(row, headword, references):
              return WorkbookRecord(
                  source_file='01 Synthetic/Worksheet 1.csv',
                  source_row=row,
                  source_page=row,
                  section='Section α',
                  root='',
                  headword=headword,
                  ktu=raw_ktu,
                  references=references,
                  locus='SYN',
                  room=str(row),
                  point=f'p{row}',
                  depth='synthetic',
                  disputed='',
                  comments=f'synthetic reviewed-CUC contract row {row}',
              )

          source = normalize_workbook_records((
              record(1, g1, reference),
              record(2, g1 + '*', reference),
              record(3, f'{g1} {g2}', reference),
              record(4, line_only_headword, reference),
              record(5, 'synthetic-tablet', ''),
          ))
          alignments = align_burns_source(source, index)
          module = build_burns_module(source, alignments, index)
          report = build_burns_module_report(source, alignments, index, module)

          base = Fabric(locations=[str(cuc)], modules=[''], silent='deep').loadAll(silent='deep')
          assert base is not None
          max_slot = base.F.otype.maxSlot
          max_node = base.F.otype.maxNode
          type_vector = tuple(base.F.otype.v(node) for node in range(1, max_node + 1))
          tablet_lines = tuple(base.L.d(index.tablet_nodes[tablet], otype='line'))
          line_words = tuple(base.L.d(line_node, otype='word'))

          with tempfile.TemporaryDirectory() as tmp:
              output = Path(tmp) / 'burns-module'
              assert write_burns_module(module, report, output)
              expected_files = {f'{feature}.tf' for feature in FEATURES} | {REPORT_FILE}
              assert {path.name for path in output.iterdir() if path.is_file()} == expected_files
              assert not (output / 'otype.tf').exists()
              assert not (output / 'oslots.tf').exists()
              for copied in ('g_cons.tf', 'tablet.tf', 'column.tf', 'line.tf'):
                  assert not (output / copied).exists(), copied

              combined = Fabric(
                  locations=[str(cuc), str(output)],
                  modules=[''],
                  silent='deep',
              ).loadAll(silent='deep')
              assert combined is not None
              assert combined.F.otype.maxSlot == max_slot
              assert combined.F.otype.maxNode == max_node
              assert tuple(
                  combined.F.otype.v(node) for node in range(1, max_node + 1)
              ) == type_vector
              assert tuple(combined.L.d(index.tablet_nodes[tablet], otype='line')) == tablet_lines
              assert tuple(combined.L.d(line_node, otype='word')) == line_words

              # Two independent annotations select the same first word; the
              # two-word span overlaps them and remains one reconstructable occurrence.
              first_payloads = burns_node_annotations(combined.F.burns_annotations.v(word1))
              assert len(first_payloads) == 3, first_payloads
              assert len({item['annotation_id'] for item in first_payloads}) == 3
              span = [item for item in first_payloads if item['anchor_nodes'] == [word1, word2]]
              assert len(span) == 1
              second_payloads = burns_node_annotations(combined.F.burns_annotations.v(word2))
              copied_span = [item for item in second_payloads if item['occurrence_id'] == span[0]['occurrence_id']]
              assert copied_span == span
              assert span[0]['anchor_nodes'] == [word1, word2]

              # An exact line reference with an unmatched synthetic headword
              # safely remains a line-level structural anchor.
              line_payloads = burns_node_annotations(combined.F.burns_annotations.v(line_node))
              assert len(line_payloads) == 1
              assert line_payloads[0]['anchor_kind'] == 'line'
              assert line_payloads[0]['anchor_nodes'] == [line_node]
              assert line_payloads[0]['headword'] == line_only_headword

              tablet_payloads = burns_node_annotations(
                  combined.F.burns_annotations.v(index.tablet_nodes[tablet])
              )
              assert len(tablet_payloads) == 1
              assert tablet_payloads[0]['anchor_kind'] == 'tablet'
              assert report['alignment']['counts']['annotations'] == 5
              assert report['counts']['records'] == 5
              assert len(report['source_records']) == 5
          PY
