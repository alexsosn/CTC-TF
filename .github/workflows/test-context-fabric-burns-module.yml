name: Context-Fabric Burns module contract

on:
  pull_request:
    paths:
      - 'docs/releases/**'
      - 'tests/test_release_version.py'
      - 'src/ugarit_context_parsing/alignment.py'
      - 'src/ugarit_context_parsing/annotations.py'
      - 'src/ugarit_context_parsing/cli.py'
      - 'src/ugarit_context_parsing/cuc_index.py'
      - 'src/ugarit_context_parsing/module.py'
      - 'src/ugarit_context_parsing/references.py'
      - 'tests/test_module_cli.py'
      - 'scripts/check_context_fabric_burns_module_contract.py'
      - '.github/workflows/test-context-fabric-burns-module.yml'
      - 'scripts/check_ci_provenance.py'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: context-fabric-burns-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-fabric-burns-module:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Burns materializer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CI provenance
        run: python scripts/check_ci_provenance.py

      - name: Check out exact reviewed CUC base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DT-UCPH/cuc
          ref: ad69400f5446e1c8217af01659c7c10ab00c015b
          path: .cuc
          persist-credentials: false

      - name: Check out exact merged Context-Fabric consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alexsosn/context-fabric
          ref: 6cd0f73f2e806c23e8406c440760139302c5671b
          path: .context-fabric
          persist-credentials: false

      - name: Run actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install producer and exact consumer
        run: |
          python -m pip install .
          python -m pip install .context-fabric/libs/core ".context-fabric/libs/mcp[dev]"

      - name: Record consumer execution environment
        run: |
          python - <<'PY'
          import hashlib
          import json
          import platform
          import sys
          from importlib import metadata

          packages = sorted(
              f"{name.casefold()}=={dist.version}"
              for dist in metadata.distributions()
              if (name := dist.metadata.get("Name"))
          )
          evidence = {
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "packages": packages,
              "context_fabric_commit": "6cd0f73f2e806c23e8406c440760139302c5671b",
              "cuc_commit": "ad69400f5446e1c8217af01659c7c10ab00c015b",
          }
          canonical = json.dumps(evidence, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          print("execution_environment=" + canonical)
          print("execution_environment_sha256=" + hashlib.sha256(canonical.encode("utf-8")).hexdigest())
          PY

      - name: Run focused core CFM composition tests
        run: python -m pytest .context-fabric/libs/core/tests/integration/test_multi_location_cfm.py -q

      - name: Run exact consumer multi-location tests
        run: python -m pytest .context-fabric/libs/mcp/tests/integration/test_multi_location_corpus.py -q

      - name: Prove CUC plus feature-only Burns through cfabric-mcp
        run: python scripts/check_context_fabric_burns_module_contract.py .cuc/tf/0.2.8
