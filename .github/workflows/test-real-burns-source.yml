name: Real Burns Workbooks feature-only acceptance

on:
  pull_request:
    paths:
      - 'scripts/check_ci_provenance.py'
      - 'tests/test_ci_provenance_contract.py'
      - 'docs/releases/**'
      - 'tests/test_release_version.py'
      - '.github/workflows/test-real-burns-source.yml'
      - 'scripts/check_real_burns_source.py'
      - 'scripts/audit_burns_alignment.py'
      - 'scripts/parse_workbooks_to_csv.py'
      - 'scripts/sources.py'
      - 'src/ugarit_context_parsing/**'
      - 'agora.materializer.json'
      - 'tests/test_agora_parent_manifest.py'
      - 'scripts/check_agora_burns_parent_binding.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-real-workbooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Burns software
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prove exact tested revision
        run: python scripts/check_ci_provenance.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check out pinned external CUC without redistributing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: DT-UCPH/cuc
          ref: ad69400f5446e1c8217af01659c7c10ab00c015b
          path: .cuc
          persist-credentials: false
      - name: Check out exact reviewed Agora parent-binding sandbox host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alexsosn/Agora
          ref: 21ae75d313a14e0ec6149ea6e8bc43e66a6b99a1
          path: .agora
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install parser and materializer
        run: python -m pip install .
      - name: Download pinned Workbooks and parse into runner-local CSVs
        run: python scripts/parse_workbooks_to_csv.py --output "$RUNNER_TEMP/burns-csv"
      - name: Validate real source coverage, feature-only output, and disk-memory cost
        run: python scripts/check_real_burns_source.py "$RUNNER_TEMP/burns-csv" .cuc/tf/0.2.8 "$RUNNER_TEMP/burns-native"
      - name: Smoke-test opt-in aggregate-only audit CLI on real Workbooks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_burns_alignment.py \
            --workbooks Workbooks \
            --cuc .cuc/tf/0.2.8 \
            --research-multitoken > "$RUNNER_TEMP/burns-multitoken-audit.json"
          python - "$RUNNER_TEMP/burns-multitoken-audit.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          research = payload["multitoken_residual_research"]
          assert payload["source"]["files"] == 45
          assert research["occurrences"] == 380
          assert sum(research["classes"].values()) == 380
          assert research["exact_hit_order"]["out_of_order"] == 19
          assert research["out_of_order_research"]["occurrences"] == 19
          assert research["one_missing_hypothesis_union"]["occurrences"] == 62
          assert research["classes"]["one_missing_unique_containment"] == 23
          assert research["classes"]["one_missing_unique_edit1"] == 39
          # The entire JSON stays runner-local; no licensed lexical values
          # or KTU/annotation/node locators are printed in CI logs.
          print("Aggregate-only user-facing multi-token audit smoke: PASS")
          PY
      - name: Install Agora host requirements and Linux network-denial sandbox
        run: |
          python -m pip install -r .agora/requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true
      - name: Real Agora registered precreated-output Burns producer with read-only CUC parent
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          # Keep the checked-out CUC corpus and Agora host outside the
          # producer plugin-root mounted into Bubblewrap.
          mv .agora "$RUNNER_TEMP/agora-host"
          # Agora refuses trusted parent snapshots below output.parent
          # (here RUNNER_TEMP). Keep reviewed CUC on a disjoint sibling tree.
          mv .cuc "$GITHUB_WORKSPACE/../reviewed-cuc"
          python scripts/check_agora_burns_parent_binding.py \
            "$RUNNER_TEMP/agora-host" \
            "$RUNNER_TEMP/burns-csv" \
            "$GITHUB_WORKSPACE/../reviewed-cuc/tf/0.2.8" \
            "$RUNNER_TEMP/agora-burns-output"
      # All licensed Workbooks, CSVs and TF artifacts remain runner-local.

